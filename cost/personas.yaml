# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản (khách du lịch tự túc đi Hà Nội 1-3 ngày)
  low: 200
  base: 500
  high: 1500
  source: "(tự ước tính) Quy mô pilot nhóm khách tự túc đi Hà Nội (18-24 tuổi, đi 1-2 lần/năm theo evidence/survey/results.csv)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: khach_di_1_ngay
    share: 0.4              # tỉ lệ người dùng kiểu này
    uses_per_month: 2       # số phiên / người / tháng (tự ước tính: người đi ngắn ngày/cuối tuần)
    turns_per_session: 1    # số lượt hỏi trong một phiên (lập lịch xong dùng luôn)
    source: "evidence/survey/results.csv (3/13 chọn thời gian lên lịch dưới 30 phút, 1-2 lần/năm); số phiên/tháng và lượt/phiên (tự ước tính)"
  - name: khach_di_2_3_ngay
    share: 0.4
    uses_per_month: 1
    turns_per_session: 3    # lập lịch + 2 lượt nhắn sửa điểm/ngân sách
    source: "evidence/survey/results.csv (8/13 mất >=2 tiếng lên lịch 2-3 ngày, 9/13 khó sửa lịch); lượt sửa (tự ước tính)"
  - name: khach_nhom_gia_dinh
    share: 0.2
    uses_per_month: 1
    turns_per_session: 4    # hỏi kỹ ràng buộc trẻ nhỏ/giờ mở cửa + nhiều lượt chỉnh lịch
    source: "evidence/survey/results.csv (9/13 khó cân đối thời gian & chi phí cho nhiều người); lượt sửa (tự ước tính)"

prices:             # USD / 1 triệu token — ≥2 mức model (gồm gemini-3.1-flash-lite đang chạy thật ở ai.py)
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 27/11/2026"
  - model: gpt-5-mini
    input: 0.25
    output: 2.00
    source: "https://openai.com/api/pricing/ · xem 27/11/2026"
  - model: gpt-5
    input: 1.25
    output: 10.00
    source: "https://openai.com/api/pricing/ · xem 27/11/2026"

usd_to_vnd:
  rate: 25400
  source: "Tỉ giá tham khảo Vietcombank ~25.400 VND/USD (tự ước tính cho bản nháp)"
